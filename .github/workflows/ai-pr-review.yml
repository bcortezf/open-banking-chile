name: 🔍 AI Security Review
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  ai-review:
    name: DeepSeek Code Review
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]'

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 📦 Install dependencies
        run: |
          python -m pip install --quiet httpx

      - name: 🔎 AI Security Analysis
        id: ai-review
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          python .github/scripts/ai_review.py

      - name: 🏷️ Label PR
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          AI_VERDICT: ${{ steps.ai-review.outcome }}
        run: |
          if [ "$AI_VERDICT" = "failure" ]; then
            gh pr edit $PR_NUMBER --add-label "⚠️ Security Review" --repo $REPO
          else
            gh pr edit $PR_NUMBER --add-label "✅ AI Reviewed" --repo $REPO
          fi
